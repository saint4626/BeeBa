LogFile /var/log/clamav/clamd.log
LogTime yes

LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

MaxConnectionQueueLength 30
MaxThreads 10
ReadTimeout 1200
CommandReadTimeout 30
SendBufTimeout 1200

# Basis maps can be close to ClamAV's 2 GiB file scanning ceiling.
# Keep this aligned with BEEBA_MAX_UPLOAD_BYTES.
StreamMaxLength 2048M
MaxFileSize 2048M
MaxScanSize 4096M

