        "200":
          description: Worker jobs visible to admin and owner roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminJob"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/jobs/{job_id}/retry:
    post:
      summary: Retry a failed or dead worker job
      operationId: retryAdminJob
      description: Moves a failed or dead job back to pending, resets attempts, clears worker lock/error state, and writes an audit log entry.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminJobRetryRequest"
      responses:
        "200":
          description: Job queued for retry and audited.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AdminJob"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/files:
    get:
      summary: List content files
      operationId: listAdminFiles
      description: Returns content file metadata for operational inspection without exposing storage object keys. Requires admin or owner role.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: scan_status
          in: query
          schema:
            type: string
            enum:
              - pending
              - running
              - clean
              - suspicious
              - infected
              - failed
              - skipped
        - name: bucket
          in: query
          schema:
            type: string
            maxLength: 120
        - name: content_id
          in: query
          schema:
            type: string
            format: uuid
        - name: hash
          in: query
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Content files visible to admin and owner roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminFile"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/files/{file_id}/rescan:
    post:
      summary: Queue a content file re-scan
      operationId: rescanAdminFile
      description: Resets failed, suspicious, or infected content files back to pending scan, queues a new scan job, moves the content item to pending_scan, and writes an audit log entry.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFileRescanRequest"
      responses:
        "200":
          description: File queued for re-scan and audited.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AdminFileRescanResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/categories:
    get:
      summary: List categories for admin management
      operationId: listAdminCategories
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: All categories visible to admin and owner roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/categories/{category_id}:
    patch:
      summary: Update category settings
      operationId: updateAdminCategory
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryUpdateRequest"
      responses:
        "200":
          description: Category updated and audited.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tags:
    get:
      summary: List tags for admin management
      operationId: listAdminTags
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Tags visible to admin and owner roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a system or user-visible tag
      operationId: createAdminTag
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTagCreateRequest"
      responses:
        "201":
          description: Tag created and audited.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tags/{tag_id}:
    patch:
      summary: Update tag settings
      operationId: updateAdminTag
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTagUpdateRequest"
      responses:
        "200":
          description: Tag updated and audited.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: beeba_access_token
      description: Browser session cookie. Unsafe methods authenticated by cookie also require `X-CSRF-Token` matching the `beeba_csrf_token` cookie.
  responses:
    Error:
      description: Consistent API error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - environment
        - started_at
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        environment:
          type: string
        started_at:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ready
        service:
          type: string
    APIStatusResponse:
      type: object
      required:
        - service
        - api_version
        - environment
        - max_upload_b
      properties:
        service:
          type: string
        api_version:
          type: string
          enum:
            - v1
        environment:
          type: string
        max_upload_b:
          type: integer
          format: int64
          minimum: 1
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    Category:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - sort_order
        - is_active
        - published_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          enum:
            - worlds
            - avatars
            - props
            - prefabs
        name:
          type: string
        description:
          type: string
        icon_key:
          type:
            - string
            - "null"
        sort_order:
          type: integer
        is_active:
          type: boolean
        published_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tag:
      type: object
      required:
        - id
        - slug
        - name
        - is_system
        - published_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_system:
          type: boolean
        published_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminCategoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
        icon_key:
          type: string
          maxLength: 80
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        is_active:
          type: boolean
    AdminTagCreateRequest:
      type: object
      required:
        - slug
        - name
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 2
          maxLength: 80
        is_system:
          type: boolean
          default: false
    AdminTagUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        is_system:
          type: boolean
    PublicContentItem:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - status
        - visibility
        - nsfw
        - category
        - author
        - tags
        - likes_count
        - downloads_count
        - comments_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - published
        visibility:
          type: string
          enum:
            - public
        nsfw:
          type: boolean
        unlock_password:
          type: string
          description: Public Basis unlock password for published public catalog items.
        category:
          type: object
          required:
            - slug
            - name
          properties:
            slug:
              type: string
            name:
              type: string
        author:
          type: object
          required:
            - id
            - username
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            display_name:
              type:
                - string
                - "null"
            avatar_image_id:
              type:
                - string
                - "null"
              format: uuid
        tags:
          type: array
          items:
            type: object
            required:
              - slug
              - name
            properties:
              slug:
                type: string
              name:
                type: string
        preview_image_id:
          type:
            - string
            - "null"
          format: uuid
        likes_count:
          type: integer
          minimum: 0
        downloads_count:
          type: integer
          minimum: 0
        comments_count:
          type: integer
          minimum: 0
        published_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicProfile:
      type: object
      required:
        - id
        - username
        - published_count
        - likes_count
        - downloads_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type:
            - string
            - "null"
        avatar_image_id:
          type:
            - string
            - "null"
          format: uuid
        published_count:
          type: integer
          minimum: 0
        likes_count:
          type: integer
          minimum: 0
        downloads_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicContentDetail:
      allOf:
        - $ref: "#/components/schemas/PublicContentItem"
        - type: object
          required:
            - gallery
            - liked_by_me
          properties:
            file:
              $ref: "#/components/schemas/PublicContentFile"
            gallery:
              type: array
              items:
                $ref: "#/components/schemas/PublicContentImage"
            liked_by_me:
              type: boolean
              description: True when the authenticated viewer has liked this content; false for anonymous viewers.
    PublicContentFile:
      type: object
      required:
        - file_size
        - file_hash_sha256
        - original_filename
      properties:
        file_size:
          type: integer
          format: int64
          minimum: 1
        file_hash_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        original_filename:
          type: string
    PublicContentImage:
      type: object
      required:
        - id
        - url
        - alt_text
        - width
        - height
        - is_primary
        - sort_order
        - created_at
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        alt_text:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        is_primary:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
    PublicComment:
      type: object
      required:
        - id
        - content_id
        - user_id
        - username
        - body
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type:
            - string
            - "null"
        parent_id:
          type:
            - string
            - "null"
          format: uuid
        body:
          type: string
        status:
          type: string
          enum:
            - visible
            - hidden
            - deleted
            - pending_moderation
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required:
        - body
      properties:
        parent_id:
          type:
            - string
            - "null"
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 2000
    LikeResult:
      type: object
      required:
        - content_id
        - liked
        - likes_count
      properties:
        content_id:
          type: string
          format: uuid
        liked:
          type: boolean
        likes_count:
          type: integer
          minimum: 0
    ReportContentRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 120
        details:
          type: string
          maxLength: 2000
    ContentReport:
      type: object
      required:
        - id
        - content_id
        - user_id
        - reason
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reason:
          type: string
        details:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - open
            - in_review
            - resolved
            - rejected
        created_at:
          type: string
          format: date-time
    OwnerContentItem:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - status
        - visibility
        - nsfw
        - category
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - uploaded
            - pending_scan
            - scan_failed
            - pending_moderation
            - approved
            - published
            - rejected
            - hidden
            - deleted
        visibility:
          type: string
          enum:
            - public
            - private
        nsfw:
          type: boolean
        unlock_password:
          type: string
          description: Basis unlock password visible only to the authenticated owner.
        category:
          type: object
          required:
            - slug
            - name
          properties:
            slug:
              type: string
            name:
              type: string
        tags:
          type: array
          items:
            type: object
            required:
              - slug
              - name
            properties:
              slug:
                type: string
              name:
                type: string
        file:
          $ref: "#/components/schemas/OwnerContentFile"
        moderation:
          $ref: "#/components/schemas/OwnerModerationFeedback"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        hidden_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnerStorageUsage:
      type: object
      required:
        - used_bytes
        - limit_bytes
      properties:
        used_bytes:
          type: integer
          format: int64
          minimum: 0
        limit_bytes:
          type: integer
          format: int64
          minimum: 1
    OwnerContentUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 4000
        visibility:
          type: string
          enum:
            - public
            - private
        nsfw:
          type: boolean
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 40
    ProfileUpdateRequest:
      type: object
      required:
        - display_name
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 80
          description: Empty string clears the display name and falls back to username publicly.
    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    EmailChangeRequest:
      type: object
      required:
        - current_password
        - new_email
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
          format: password
        new_email:
          type: string
          format: email
    OwnerContentFile:
      type: object
      required:
        - id
        - scan_status
        - file_size
        - file_hash_sha256
        - original_filename
        - safe_filename
      properties:
        id:
          type: string
          format: uuid
        scan_status:
          type: string
          enum:
            - pending
            - running
            - clean
            - suspicious
            - infected
            - failed
            - skipped
        file_size:
          type: integer
          format: int64
        file_hash_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        original_filename:
          type: string
        safe_filename:
          type: string
    OwnerModerationFeedback:
      type: object
      required:
        - action
        - reason
        - created_at
      properties:
        action:
          type: string
          enum:
            - reject
            - hide
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    ContentUploadRequest:
      type: object
      required:
        - category
        - title
        - unlock_password
        - file
      properties:
        category:
          type: string
          enum:
            - worlds
            - avatars
            - props
            - prefabs
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum:
            - public
            - private
          default: public
        unlock_password:
          type: string
          minLength: 1
          maxLength: 256
          description: Basis unlock password. Public items expose it in catalog after publish; private items expose it only to the owner.
        nsfw:
          type: boolean
          default: false
        file:
          type: string
          format: binary
          description: ".bee package. Stored in quarantine until scan and moderation complete."
    ContentUploadCreated:
      type: object
      required:
        - content_id
        - file_id
        - job_id
        - status
        - scan_status
        - storage_bucket
        - storage_key
        - file_hash_sha256
        - file_size
        - original_filename
        - visibility
        - created_at
      properties:
        content_id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending_scan
        scan_status:
          type: string
          enum:
            - pending
        storage_bucket:
          type: string
        storage_key:
          type: string
        file_hash_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        file_size:
          type: integer
          format: int64
        original_filename:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
        created_at:
          type: string
          format: date-time
    ImageUploadRequest:
      type: object
      required:
        - file
      properties:
        alt_text:
          type: string
          maxLength: 500
          description: Optional image alternative text. For content images, blank or missing values default to the content title.
        file:
          type: string
          format: binary
          description: JPEG or PNG image. Stored in preview storage and asynchronously converted to compressed WebP before public serving. The default maximum upload size is 8 MiB unless configured differently.
    UploadedImage:
      type: object
      required:
        - id
        - kind
        - url
        - alt_text
        - width
        - height
        - file_size
        - file_hash_sha256
        - mime_type_detected
        - processing_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - user_avatar
            - content_image
        content_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
        alt_text:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        file_size:
          type: integer
          format: int64
          minimum: 1
        file_hash_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        mime_type_detected:
          type: string
          enum:
