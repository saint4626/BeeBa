openapi: 3.1.0
info:
  title: BeeBa API
  version: 0.1.0
  description: Versioned API for the BeeBa Basis / VR content catalog.
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: https://beeba.org
    description: Production domain
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: Process is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /openapi.yaml:
    get:
      summary: OpenAPI YAML document
      operationId: getOpenAPIYaml
      responses:
        "200":
          description: Current OpenAPI document for the BeeBa API.
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: OpenAPI document is not available.
  /api/v1/status:
    get:
      summary: API status and public runtime limits
      operationId: getAPIStatus
      responses:
        "200":
          description: API status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/categories:
    get:
      summary: List active public content categories
      operationId: listCategories
      responses:
        "200":
          description: Active categories ordered for catalog navigation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/tags:
    get:
      summary: List public tags with published content counts
      operationId: listTags
      responses:
        "200":
          description: Public tags ordered by published content count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content:
    get:
      summary: List published public content
      operationId: listContent
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum:
              - worlds
              - avatars
              - props
              - prefabs
        - name: author
          in: query
          description: Filter by public author username.
          schema:
            type: string
            minLength: 3
            maxLength: 32
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: tags
          in: query
          description: Comma-separated tag slugs. Results match any provided tag.
          schema:
            type: string
            maxLength: 500
        - name: include_nsfw
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - likes
              - downloads
            default: newest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Published content page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicContentItem"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{username}:
    get:
      summary: Get a public user profile
      operationId: getPublicProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
      responses:
        "200":
          description: Public user profile with published-content counters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PublicProfile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/search:
    get:
      summary: Search published public content with Meilisearch
      operationId: searchContent
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
          schema:
            type: string
            enum:
              - worlds
              - avatars
              - props
              - prefabs
        - name: tags
          in: query
          description: Comma-separated tag slugs. Results match any provided tag.
          schema:
            type: string
            maxLength: 500
        - name: include_nsfw
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - likes
              - downloads
            default: newest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results hydrated from PostgreSQL after Meilisearch ranking.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicContentItem"
                  pagination:
                    $ref: "#/components/schemas/SearchPagination"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/uploads:
    post:
      summary: Upload a .bee package into quarantine
      operationId: uploadContentPackage
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContentUploadRequest"
      responses:
        "201":
          description: Upload metadata persisted and scan job queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ContentUploadCreated"
        "409":
          description: The authenticated user already uploaded a non-deleted `.bee` file with the same SHA-256 hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/{content_id}/comments:
    get:
      summary: List visible comments for published public content
      operationId: listContentComments
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Visible comments ordered by newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicComment"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create and publish a visible comment
      operationId: createContentComment
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created with visible status. Moderators can hide it later if needed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PublicComment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/{content_id}/like:
    post:
      summary: Like published public content
      operationId: likeContent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Like state and current count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/LikeResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove the authenticated user's like
      operationId: unlikeContent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Like state and current count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/LikeResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/{content_id}/report:
    post:
      summary: Report published public content
      operationId: reportContent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportContentRequest"
      responses:
        "201":
          description: Open content report.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ContentReport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/{content_id}:
    get:
      summary: Get published public content details
      operationId: getPublicContent
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published public content with processed gallery images.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PublicContentDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/content/{content_id}/download:
    get:
      summary: Download a published public .bee package through the backend
      description: Supports HTTP byte range requests for Basis clients that download only the package connector and the platform-specific section.
      operationId: downloadPublicContentPackage
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional single byte range, for example `bytes=0-7`.
          schema:
            type: string
      responses:
        "200":
          description: Binary .bee package stream.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Length:
              description: Full package size in bytes.
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial .bee package stream for a satisfiable byte range.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Returned byte range and full package size.
              schema:
                type: string
              example: bytes 0-7/80723368
            Content-Length:
              description: Returned range size in bytes.
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: Requested byte range is not satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Full package size for retrying with a valid range.
              schema:
                type: string
              example: bytes */80723368
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
    head:
      summary: Inspect a published public .bee package download
      description: Returns download headers, including byte range support, without streaming the package.
      operationId: headPublicContentPackageDownload
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional single byte range, for example `bytes=0-7`.
          schema:
            type: string
      responses:
        "200":
          description: Package exists and can be downloaded.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Length:
              description: Full package size in bytes.
              schema:
                type: integer
                format: int64
        "206":
          description: Requested byte range is satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Returned byte range and full package size.
              schema:
                type: string
              example: bytes 0-7/80723368
            Content-Length:
              description: Returned range size in bytes.
              schema:
                type: integer
                format: int64
        "416":
          description: Requested byte range is not satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Full package size for retrying with a valid range.
              schema:
                type: string
              example: bytes */80723368
        default:
          $ref: "#/components/responses/Error"
  /api/v1/media/{image_id}:
    get:
      summary: Serve a processed public image
      operationId: getPublicMediaImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Processed WebP image stream.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/profile:
    patch:
      summary: Update the authenticated user's public profile fields
      operationId: updateCurrentUserProfile
      description: Updates public identity fields that do not require email verification or URL migration.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated authenticated user profile.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUser"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    patch:
      summary: Request authenticated user's password change
      operationId: changeCurrentUserPassword
      description: Verifies the current password and queues an email confirmation. The new Argon2id hash is stored only after the confirmation token is submitted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "202":
          description: Password change confirmation email queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUser"
                  meta:
                    type: object
                    required:
                      - confirmation_sent
                    properties:
                      confirmation_sent:
                        type: boolean
                        const: true
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/email:
    patch:
      summary: Request authenticated user's email change
      operationId: changeCurrentUserEmail
      description: Verifies the current password and queues a confirmation link to the new address. The account email is updated only after the confirmation token is submitted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "202":
          description: Email change confirmation email queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUser"
                  meta:
                    type: object
                    required:
                      - confirmation_sent
                      - pending_email
                    properties:
                      confirmation_sent:
                        type: boolean
                        const: true
                      pending_email:
                        type: string
                        format: email
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/content:
    get:
      summary: List content owned by the authenticated user
      operationId: listOwnedContent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - uploaded
              - pending_scan
              - scan_failed
              - pending_moderation
              - approved
              - published
              - rejected
              - hidden
              - deleted
        - name: visibility
          in: query
          schema:
            type: string
            enum:
              - public
              - private
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Owned content page, including private items and upload/scan state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                  - storage
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerContentItem"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
                  storage:
                    $ref: "#/components/schemas/OwnerStorageUsage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/content/{content_id}:
    patch:
      summary: Update metadata for content owned by the authenticated user
      operationId: updateOwnedContent
      description: Published, approved, rejected, and hidden items with a clean scanned file are returned to pending_moderation after owner metadata changes.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerContentUpdateRequest"
      responses:
        "200":
          description: Updated owned content item.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OwnerContentItem"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Soft-delete content owned by the authenticated user
      operationId: deleteOwnedContent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Owned content was soft-deleted and removed from public search if needed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/avatar:
    post:
      summary: Upload the authenticated user's avatar image
      description: Accepts one JPEG or PNG image up to the configured image upload limit. A successful upload replaces the current avatar and queues the new image for processing.
      operationId: uploadCurrentUserAvatar
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadRequest"
      responses:
        "201":
          description: Avatar image stored and image processing job queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/UploadedImage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/media/{image_id}:
    get:
      summary: Serve a processed image owned by the authenticated user
      operationId: getOwnedMediaImage
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Processed WebP image bytes for the owner, including private or unmoderated content images.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/content/{content_id}/images:
    get:
      summary: List preview and gallery images for owned content
      operationId: listOwnedContentImages
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned content images.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UploadedImage"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Upload a preview or gallery image for owned content
      operationId: uploadOwnedContentImage
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImageUploadRequest"
                - type: object
                  properties:
                    is_primary:
                      type: boolean
                      description: When true, this image becomes the content card/detail preview.
                    sort_order:
                      type: integer
                      minimum: 0
                      maximum: 1000
      responses:
        "201":
          description: Content image stored and image processing job queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/UploadedImage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/content/{content_id}/images/{image_id}:
    patch:
      summary: Update metadata for an owned content image
      operationId: updateOwnedContentImage
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentImageUpdateRequest"
      responses:
        "200":
          description: Updated owned content image.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/UploadedImage"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove an owned content image from public and owner galleries
      operationId: deleteOwnedContentImage
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Image removed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/content/{content_id}/download:
    get:
      summary: Download an owned published .bee package through the backend
      description: Supports HTTP byte range requests for Basis clients that download only the package connector and the platform-specific section.
      operationId: downloadOwnerContentPackage
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional single byte range, for example `bytes=0-7`.
          schema:
            type: string
      responses:
        "200":
          description: Binary .bee package stream for the owner.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Length:
              description: Full package size in bytes.
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial .bee package stream for a satisfiable byte range.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Returned byte range and full package size.
              schema:
                type: string
              example: bytes 0-7/80723368
            Content-Length:
              description: Returned range size in bytes.
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: Requested byte range is not satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Full package size for retrying with a valid range.
              schema:
                type: string
              example: bytes */80723368
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
    head:
      summary: Inspect an owned published .bee package download
      description: Returns download headers, including byte range support, without streaming the package.
      operationId: headOwnerContentPackageDownload
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional single byte range, for example `bytes=0-7`.
          schema:
            type: string
      responses:
        "200":
          description: Package exists and can be downloaded by the owner.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Length:
              description: Full package size in bytes.
              schema:
                type: integer
                format: int64
        "206":
          description: Requested byte range is satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Returned byte range and full package size.
              schema:
                type: string
              example: bytes 0-7/80723368
            Content-Length:
              description: Returned range size in bytes.
              schema:
                type: integer
                format: int64
        "416":
          description: Requested byte range is not satisfiable.
          headers:
            Accept-Ranges:
              description: Indicates byte range support.
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              description: Full package size for retrying with a valid range.
              schema:
                type: string
              example: bytes */80723368
        default:
          $ref: "#/components/responses/Error"
